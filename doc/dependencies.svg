  <line style="stroke:gray" stroke-dasharray="1,0" x1="0px" y1="0px" x2="-10px" y2="5px"/>
  </marker>
  <line x1="187px" y1="420px" x2="541px" y2="300px"
    style="stroke:gray;stroke-width:1px;stroke-dasharray:4,4;marker-end:url(#open_arrow);"/>
  <line x1="187px" y1="420px" x2="187px" y2="300px"
    style="stroke:gray;stroke-width:1px;stroke-dasharray:4,4;marker-end:url(#open_arrow);"/>
  <line x1="187px" y1="220px" x2="187px" y2="100px"
